[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sports-tail-trader"
version = "0.1.0"
description = "Polymarket sports tail-end trading runtime scaffold."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "asyncpg>=0.29",
  "fastapi>=0.110",
  # SQLAlchemy async（greenlet_spawn）在 macOS arm64 + Python 3.12 上 SQLAlchemy
  # 不会传递安装 greenlet，缺它会让 initialize_database 立刻 ValueError。
  "greenlet>=3.0",
  "httpx>=0.26",
  # HTTP/2 multiplexing 给 httpx；跨洋代理链路下 HPACK + 单连接多 stream 关键。
  "h2>=4.0",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "psutil>=5.9",
  "py-clob-client-v2>=1.0.0",
  "sqlalchemy>=2.0",
  "uvicorn[standard]>=0.27",
  "websockets>=12",
]

[project.optional-dependencies]
dev = [
  "freezegun>=1.5",
  "mypy>=1.8",
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "ruff>=0.4",
  "testcontainers[postgres]>=4.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
pythonpath = ["src"]
markers = [
  "pg: tests requiring a real PostgreSQL container (enable with --pg)",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# 历史代码大量使用紧凑单行风格 (if x: y / a; b), 项目接受这种写法不强制拆行.
# E402 (module import not at top): 条件 import / lazy import 避免循环依赖, 合法用例多.
# E741 (ambiguous variable name): 个别 l/i 在数学上下文有意义, 不强制改名.
extend-ignore = ["E701", "E702", "E402", "E741"]

[[tool.mypy.overrides]]
module = ["py_clob_client_v2.*"]
ignore_missing_imports = true
