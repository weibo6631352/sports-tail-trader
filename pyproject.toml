[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sports-tail-trader"
version = "0.1.0"
description = "Polymarket sports tail-end trading runtime scaffold."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "asyncpg>=0.29",
  "fastapi>=0.110",
  "httpx>=0.26",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "py-clob-client-v2>=1.0.0",
  "sqlalchemy>=2.0",
  "uvicorn[standard]>=0.27",
  "websockets>=12",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.8",
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "ruff>=0.4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[[tool.mypy.overrides]]
module = ["py_clob_client_v2.*"]
ignore_missing_imports = true
