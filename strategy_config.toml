# TradingWorkflowConfig 运行时覆盖（启动期由 load_workflow_config 自动加载）。
# 字段名对齐 src/polymarket_trader/workflow/config.py:TradingWorkflowConfig。
# 未列出的字段使用代码内默认值。
#
# Kelly sizing（实盘调过的非默认值——必须显式写在这里）：
# - kelly_fraction=0.5（half Kelly；默认 0.25 quarter Kelly 过保守）
# - kelly_max_position_fraction=0.30（单仓 30% bankroll；默认 1.0 不限）
# - kelly_min_edge=0.01（100bps；默认 0.02 过严）
# - kelly_min_stake_usdc=0.30（让低价市场能下；默认 1 USDC 偏高）
# - kelly_round_up_max_overbet_ratio=10（round-up 上限；默认值即此，保留作显式记录）
# - kelly_allow_round_up_to_market_min=true（默认即此）
kelly_fraction = "0.5"
kelly_max_position_fraction = "0.30"
kelly_min_edge = "0.01"
kelly_min_stake_usdc = "0.30"
kelly_allow_round_up_to_market_min = true
kelly_round_up_max_overbet_ratio = "10.0"
